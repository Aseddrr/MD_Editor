[package]
name = "lightmark"
version = "0.1.0"
description = "A lightweight Markdown editor for Windows"
authors = ["MHL"]
edition = "2024"

[lib]
name = "lightmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
