<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LightMark</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="toolbar">
        <div class="brand" aria-label="LightMark">
          <span class="brand-mark">M</span>
          <span class="brand-name">LightMark</span>
        </div>
        <div class="toolbar-group" aria-label="文件操作">
          <button type="button" data-action="new" title="新建（Ctrl+N）">新建</button>
          <button type="button" data-action="open" title="打开文件（Ctrl+O）">打开</button>
          <button type="button" data-action="open-folder" title="打开文件夹（Ctrl+Shift+O）">文件夹</button>
          <button type="button" data-action="save" title="保存（Ctrl+S）">保存</button>
          <button type="button" data-action="save-as" title="另存为（Ctrl+Shift+S）">另存为</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group" aria-label="显示设置">
          <button id="view-mode-button" type="button" title="切换编辑与预览布局">分栏</button>
          <button id="theme-button" type="button" title="切换深色或浅色主题">深色</button>
        </div>
      </header>

      <div class="app-body">
        <aside class="sidebar">
          <section class="sidebar-section file-section">
            <div class="section-heading">
              <div>
                <span class="section-title">文件</span>
                <span id="folder-name" class="section-subtitle">未打开文件夹</span>
              </div>
              <button id="refresh-tree-button" class="icon-button" type="button" title="刷新文件树">↻</button>
            </div>
            <label class="filter-field">
              <span class="sr-only">筛选文件名</span>
              <input id="file-filter" type="search" placeholder="筛选文件名…" autocomplete="off" />
            </label>
            <div id="file-tree" class="file-tree" aria-label="Markdown 文件树"></div>
          </section>

          <section class="sidebar-section outline-section">
            <div class="section-heading">
              <span class="section-title">大纲</span>
              <span id="outline-count" class="section-count">0</span>
            </div>
            <nav id="outline" class="outline" aria-label="文档大纲"></nav>
          </section>
        </aside>

        <main class="workspace">
          <div id="welcome" class="welcome-panel">
            <div class="welcome-card">
              <span class="welcome-mark">M</span>
              <h1>轻量 Markdown 工作台</h1>
              <p>打开文件或文件夹，也可以新建一份文档。</p>
              <div class="welcome-actions">
                <button type="button" data-action="new" class="primary-button">新建文档</button>
                <button type="button" data-action="open">打开文件</button>
                <button type="button" data-action="open-folder">打开文件夹</button>
              </div>
              <div class="recent-section">
                <h2>最近文件</h2>
                <div id="recent-files" class="recent-files"></div>
              </div>
            </div>
          </div>

          <section class="pane editor-pane" aria-label="Markdown 编辑器">
            <header class="pane-header">
              <span>编辑</span>
              <div class="format-toolbar" aria-label="Markdown 格式">
                <button type="button" data-format="heading" title="二级标题">H2</button>
                <button type="button" data-format="bold" title="粗体（Ctrl+B）"><strong>B</strong></button>
                <button type="button" data-format="italic" title="斜体（Ctrl+I）"><em>I</em></button>
                <button type="button" data-format="code" title="行内代码（Ctrl+E）">&lt;/&gt;</button>
                <button type="button" data-format="link" title="链接（Ctrl+K）">链接</button>
                <button type="button" data-format="list" title="无序列表">列表</button>
              </div>
            </header>
            <div id="find-bar" class="find-bar" hidden>
              <input id="find-input" type="search" placeholder="在当前文档中查找…" autocomplete="off" />
              <span id="find-count" aria-live="polite">0/0</span>
              <button id="find-previous" type="button" title="上一个匹配">↑</button>
              <button id="find-next" type="button" title="下一个匹配">↓</button>
              <button id="find-close" type="button" title="关闭查找">×</button>
            </div>
            <textarea
              id="editor"
              aria-label="Markdown 文本"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="开始书写 Markdown…"
            ></textarea>
          </section>

          <section class="pane preview-pane" aria-label="Markdown 预览">
            <header class="pane-header"><span>预览</span></header>
            <article id="preview" class="markdown-body"></article>
          </section>
        </main>
      </div>

      <footer class="statusbar">
        <span id="document-path">未命名.md</span>
        <span class="status-spacer"></span>
        <span id="save-status">就绪</span>
        <span id="cursor-status">行 1，列 1</span>
      </footer>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
